<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>ToMpathy · Review desk</title>
    <link rel="stylesheet" href="review.css" />
  </head>
  <body>
    <main class="desk">
      <header>
        <a class="brand" href="review.html"
          ><img src="icon32.png" width="24" height="24" alt="" />ToMpathy</a
        ><span class="build" id="build"></span>
      </header>
      <div class="intro">
        <p class="eyebrow">YOUR LOCAL REVIEW DESK</p>
        <h1>A place to look closer.</h1>
      </div>
      <nav class="destinations" aria-label="Review destinations">
        <a
          class="destination"
          href="example.html"
          target="_blank"
          rel="noopener"
          ><span class="number">01</span
          ><strong
            >Open the testing environment
            <span aria-hidden="true">↗</span></strong
          ><span>The door we stopped explaining</span></a
        >
        <button class="destination" disabled>
          <span class="number">02</span><strong>Live creator</strong
          ><span>Coming later</span>
        </button>
        <a class="destination" href="icon-prompts.html"
          ><span class="number">03</span
          ><strong>Icon prompts <span aria-hidden="true">→</span></strong
          ><span>Four generated logo studies and twelve prompt directions</span></a
        >
      </nav>
      <footer>
        In the example, choose <strong>Open Maker Reader</strong> to bring up
        the Chrome side panel.
      </footer>
    </main>
    <script type="module" src="review.js"></script>
  </body>
</html>
